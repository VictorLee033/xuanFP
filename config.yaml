# xuanFP 配置文件
# ✅ 本文件不含任何密钥，可安全上传到公开仓库。
# 🔑 真实 API 密钥请填写在本目录下的 config.local.yaml（已被 .gitignore 排除），
#    或在界面右上角「设置」里填写——程序会自动把密钥写入 config.local.yaml。
app:
  host: 127.0.0.1
  port: 8710
  debug: false

# Tushare 代理双通道（密钥见 config.local.yaml）
tushare:
  pcd:
    base_url: "https://pcd.mobcvb.cn/tushare/pro"
    api_key: ""
  rds:
    base_url: "http://datahubco.com/app-api/openapi/v1/tushare"
    api_key: ""

# 东方财富开源实时行情（push2delay 延迟行情域名）
eastmoney:
  clist_url: "https://push2delay.eastmoney.com/api/qt/clist/get"
  stock_url: "https://push2delay.eastmoney.com/api/qt/stock/get"
  page_size: 100

# 腾讯行情（K线主源 / 实时备选）
tencent:
  kline_url: "http://web.ifzq.gtimg.cn/appstock/app/fqkline/get"
  quote_url: "http://qt.gtimg.cn/q="

# 新浪行情（美股外盘映射 / 实时备选）
sina:
  quote_url: "https://hq.sinajs.cn/list="

# LLM 报告生成（DeepSeek / OpenAI 兼容接口；key 留空则使用 Mock 报告）
llm:
  base_url: "https://api.deepseek.com/v1"
  api_key: ""            # 真实 Key 见 config.local.yaml
  model: "deepseek-chat"
  timeout: 90
  top_n_reports: 10

# 邮件推送（14:25 短线榜单发邮箱；真实授权码见 config.local.yaml）
mail:
  smtp_host: "smtp.qq.com"
  smtp_port: 465
  sender: ""
  auth_code: ""
  recipient: ""

# 扫描参数
scanner:
  max_workers: 24        # 并发拉取线程数
  universe_limit: 0      # 0=全市场；>0 时只扫描前 N 只（用于快速测试）
  kline_days: 320        # K线拉取天数（覆盖 MA250）
  moneyflow_days: 5
  top_list_days: 10
  margin_days: 30
  stretch_beta: 0.15     # 综合分头部拉伸强度（0=不拉伸；越大头部越陡，>0.5会重新虚高）
  # 回测库记录时点窗口：只有在该时段内完成的扫描才写入回测库（保证回测时点统一）
  record_windows:
    short: ["14:20", "14:35"]    # 短线 → 14:25 快照
    normal: ["15:00", "15:20"]   # 标准 → 15:00 收盘
  # 九大维度权重（合计 100）
  weights:
    value: 13      # 价值估值
    quality: 16    # 资产质量
    growth: 15     # 盈利成长
    trend: 11      # 趋势技术面
    momentum: 10   # 量价动能
    capital: 11    # 主力资金流
    chip: 12       # 情绪
    safety: 7      # 安全边际
    macro: 5       # 景气与宏观

# 模式预设（短线模式：动量+资金+情绪为主，PE 放宽到 300）
presets:
  short:
    label: "短线"
    pe_max: 300
    weights:
      value: 5
      quality: 8
      growth: 8
      trend: 18
      momentum: 16
      capital: 16
      chip: 16
      safety: 8
      macro: 5
