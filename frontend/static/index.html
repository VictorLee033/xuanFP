<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>xuanFP · 智能股票工作台</title>
<link rel="stylesheet" href="/vendor/element-plus.css" />
<link rel="stylesheet" href="/vendor/element-plus.dark.css" />
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#3b82f6;--up:#f5222d;--down:#52c41a}
html,body,#app{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
*{box-sizing:border-box}
.xuanfp{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
.header .logo{font-size:20px;font-weight:700;color:#fff}
.header .logo span{color:var(--accent)}
.header .indices{display:flex;gap:14px;margin-left:12px;font-size:13px;flex-wrap:wrap}
.header .indices .idx{color:var(--muted);white-space:nowrap}
.header .indices .idx b{color:var(--text);font-weight:600}
.header .spacer{flex:1}
.content{flex:1;overflow:auto;padding:16px 20px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:15px;color:#e6edf3}
.progress-box{margin-top:12px}
.progress-box .phase{font-size:13px;color:var(--muted);margin-bottom:6px}
.logic-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.6;color:#dbe4ec}
.logic-card .no{color:var(--accent);font-weight:700;margin-right:6px}
.score-strong{color:#f59e0b;font-weight:700}
.el-table{--el-table-bg-color:transparent;--el-table-tr-bg-color:transparent}
.drawer-body{padding:4px 4px 24px}
.chart{width:100%;height:300px}
.chart-sm{width:100%;height:380px}
.stat-card{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-value{font-size:22px;font-weight:700;color:#e6edf3}
.clickable{cursor:pointer}
.md h2{font-size:15px;color:#e6edf3;margin:14px 0 6px;border-left:3px solid var(--accent);padding-left:8px}
.md h3{font-size:14px;color:#e6edf3;margin:12px 0 4px}
.md p{margin:6px 0;line-height:1.7;color:#c9d1d9;font-size:13.5px}
.md strong{color:#fff}
.md blockquote{margin:8px 0;padding:6px 12px;background:#21262d;border-left:3px solid #f59e0b;color:#8b949e;font-size:12.5px}
</style>
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="app-tpl">
<div class="xuanfp">
  <div class="header">
    <div class="logo">xuan<span>FP</span> 智能股票工作台</div>
    <div class="indices">
      <div v-for="(v,k) in indices" :key="k" class="idx">
        {{ v.name }} <b :style="{color: v.pct_chg>=0 ? 'var(--up)' : 'var(--down)'}">{{ v.price }} {{ fmtPct(v.pct_chg) }}</b>
      </div>
    </div>
    <div class="spacer"></div>
    <el-switch v-model="shortMode" active-text="⚡短线" inactive-text="综合" inline-prompt
               style="--el-switch-on-color:#d35400" title="短线模式：趋势/量价/资金/情绪权重，PE上限放宽到300" />
    <el-button type="primary" size="large" :loading="scanning" @click="startScan">{{ scanning ? '扫描中…' : '🚀 开始扫描' }}</el-button>
    <el-button size="large" :type="pushScheduled ? 'warning' : 'default'" @click="schedulePush" title="安排次日14:25自动短线扫描并发邮件">📮明日推送</el-button>
    <el-button size="large" @click="previewPush" :loading="pushPreviewing" title="立即手动触发一次短线扫描+发邮件">🔔立即预演</el-button>
    <el-button size="large" @click="openHistory">📊 历史对比</el-button>
    <el-button size="large" @click="openBacktest">📈 Top10 回测</el-button>
    <el-button size="large" circle @click="settingsVisible=true">⚙</el-button>
  </div>

  <div class="content">
    <div v-if="scanning || scanMsg" class="panel">
      <h3>扫描进度</h3>
      <div class="progress-box">
        <div class="phase">{{ scanMsg }}</div>
        <el-progress :percentage="progressPct" :stroke-width="14" striped striped-flow />
      </div>
    </div>

    <div class="panel">
      <h3>🏆 综合排名 Top 10
        <span v-if="latestRun" style="color:var(--muted);font-weight:400;font-size:12px">（{{ latestRun.stats?.date }} · 覆盖 {{ latestRun.stats?.universe }} 只 · 评分池 {{ latestRun.stats?.pool }} 只 · 耗时 {{ latestRun.stats?.duration }}s）</span>
      </h3>
      <el-table :data="top20" style="width:100%" :header-cell-style="{background:'var(--panel2)',color:'#8b949e'}" @row-click="openDetail" row-class-name="clickable">
        <el-table-column prop="rank" label="排名" width="70" sortable />
        <el-table-column prop="ts_code" label="股票代码" width="120" />
        <el-table-column prop="name" label="股票名称" min-width="120">
          <template #default="{ row }"><span style="color:#e6edf3;font-weight:600">{{ row.name }}</span></template>
        </el-table-column>
        <el-table-column prop="price" label="最新价" width="90" />
        <el-table-column label="所属行业" min-width="110">
          <template #default="{ row }">{{ row.sw_industry || row.industry || '-' }}</template>
        </el-table-column>
        <el-table-column label="综合得分" width="140" sortable prop="score">
          <template #default="{ row }">
            <el-progress :percentage="Math.round(row.score)" :stroke-width="12" :color="scoreColor(row.score)" />
            <span class="score-strong">{{ row.score }}</span>
          </template>
        </el-table-column>
        <el-table-column label="投资建议" width="130">
          <template #default="{ row }">
            <el-tag :type="adviceType(row.score)" effect="dark" size="small">{{ scoreAdvice(row.score) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="次日止盈" width="90" align="right">
          <template #default="{ row }"><span style="color:var(--up)">{{ stopTarget(row,'target') }}</span></template>
        </el-table-column>
        <el-table-column label="次日止损" width="90" align="right">
          <template #default="{ row }"><span style="color:var(--down)">{{ stopTarget(row,'stop') }}</span></template>
        </el-table-column>
      </el-table>
    </div>

    <div class="panel">
      <h3>📌 今日扫描 Top 3 核心逻辑</h3>
      <div v-if="summary.top3_logic && summary.top3_logic.length">
        <div v-for="(line,i) in summary.top3_logic" :key="i" class="logic-card"><span class="no">{{ ['①','②','③'][i] || (i+1) }}</span>{{ line }}</div>
      </div>
      <div v-else style="color:var(--muted)">暂无扫描结果，点击「开始扫描」生成。</div>
      <div v-if="summary.industry_stats && summary.industry_stats.length" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px">
        <el-tag v-for="it in summary.industry_stats" :key="it.industry" effect="plain" size="small">{{ it.industry }} · {{ it.count }}只</el-tag>
      </div>
    </div>

    <div v-if="summary.data_gaps && summary.data_gaps.length" class="panel" style="opacity:.85">
      <h3>ℹ️ 数据缺口与简化说明</h3>
      <ul style="margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.8">
        <li v-for="g in summary.data_gaps" :key="g">{{ g }}</li>
      </ul>
    </div>
  </div>

  <el-drawer v-model="detailVisible" size="62%" :title="detailTitle">
    <div class="drawer-body" v-if="detail">
      <div style="display:flex;gap:12px;align-items:baseline;margin-bottom:12px">
        <span style="font-size:22px;font-weight:700">{{ detail.name }}</span>
        <span style="color:var(--muted)">{{ detail.ts_code }} · {{ detail.industry }}</span>
        <span class="score-strong" style="font-size:20px;margin-left:auto">{{ detail.score }} 分</span>
      </div>
      <el-tabs v-model="tab">
        <el-tab-pane label="K线图" name="kline"><div ref="klineEl" class="chart"></div></el-tab-pane>
        <el-tab-pane label="九维雷达" name="radar"><div ref="radarEl" class="chart-sm"></div></el-tab-pane>
        <el-tab-pane label="因子明细" name="factors">
          <el-table :data="factorRows" class="factor-table" size="small" max-height="520">
            <el-table-column prop="name" label="因子" min-width="150" />
            <el-table-column label="得分" width="70">
              <template #default="{ row }"><b>{{ row.score==null ? '—' : Math.round(row.score) }}</b></template>
            </el-table-column>
            <el-table-column prop="note" label="说明" min-width="240" show-overflow-tooltip />
          </el-table>
        </el-tab-pane>
        <el-tab-pane label="AI 分析报告" name="report">
          <div v-if="report" class="md" v-html="renderMd(report)"></div>
          <div v-else style="color:var(--muted)">报告生成中或未配置大模型…</div>
        </el-tab-pane>
      </el-tabs>
    </div>
  </el-drawer>

  <el-dialog v-model="historyVisible" title="扫描历史对比" width="860px">
    <div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
      <div style="color:var(--muted);font-size:13px;margin-bottom:6px">扫描记录（可删除）</div>
      <div style="max-height:190px;overflow:auto">
        <div v-for="r in runs" :key="r.id" style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border)">
          <span style="flex:1;font-size:13px">{{ runLabel(r) }}</span>
          <el-button type="danger" size="small" plain @click="deleteRun(r.id)">删除</el-button>
        </div>
        <div v-if="!runs.length" style="color:var(--muted);font-size:13px;padding:8px 0">暂无扫描记录</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:12px">
      <el-select v-model="cmpA" placeholder="基准扫描" style="flex:1">
        <el-option v-for="r in runs" :key="r.id" :label="runLabel(r)" :value="r.id" />
      </el-select>
      <el-select v-model="cmpB" placeholder="对比扫描" style="flex:1">
        <el-option v-for="r in runs" :key="r.id" :label="runLabel(r)" :value="r.id" />
      </el-select>
      <el-button type="primary" :disabled="!cmpA || !cmpB" @click="doCompare">对比</el-button>
    </div>
    <el-table :data="compareRows" size="small" max-height="440">
      <el-table-column prop="ts_code" label="代码" width="110" />
      <el-table-column prop="name" label="名称" width="120" />
      <el-table-column label="得分变化" width="150">
        <template #default="{ row }"><span :style="{color: row.diff>=0 ? 'var(--up)' : 'var(--down)'}">{{ row.score_a }} → {{ row.score_b }}（{{ row.diff>0?'+':'' }}{{ row.diff }}）</span></template>
      </el-table-column>
      <el-table-column label="排名变化" width="120">
        <template #default="{ row }">{{ row.rank_a || '-' }} → {{ row.rank_b }}</template>
      </el-table-column>
      <el-table-column prop="change" label="类型" width="100">
        <template #default="{ row }"><el-tag :type="row.diff>=0?'success':'danger'" size="small">{{ row.diff>=0?'上升':'下降' }}</el-tag></template>
      </el-table-column>
    </el-table>
  </el-dialog>

  <el-dialog v-model="backtestVisible" title="📈 Top10 回测（复盘选股效果）" width="980px">
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <el-radio-group v-model="btMode" size="default">
        <el-radio-button label="normal">📊 普通回测</el-radio-button>
        <el-radio-button label="short">⚡ 短线回测</el-radio-button>
      </el-radio-group>
      <span style="color:var(--muted)">持有期 N 个交易日：</span>
      <el-input-number v-model="btN" :min="1" :max="60" size="small" />
      <el-button type="primary" :loading="btLoading" @click="runBacktest">开始回测</el-button>
      <span v-if="btResult" style="color:var(--muted);font-size:13px">
        共 {{ btResult.summary.total_batches }} 批 · {{ btResult.summary.total_records }} 只
        <template v-if="btResult.summary.skipped">（跳过 {{ btResult.summary.skipped }} 只未满窗口）</template>
      </span>
    </div>

    <div v-if="btResult && btResult.summary.avg_ret != null" style="display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap">
      <div class="stat-card">
        <div class="stat-label">平均收益（N={{ btResult.n }} 天）</div>
        <div class="stat-value" :style="{color: btResult.summary.avg_ret>=0 ? 'var(--up)' : 'var(--down)'}">{{ fmtPct(btResult.summary.avg_ret) }}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">胜率（收益为正占比）</div>
        <div class="stat-value">{{ btResult.summary.win_rate }}%</div>
      </div>
      <template v-if="btResult.summary.nd">
        <div class="stat-card">
          <div class="stat-label">平均卖「次日最高」</div>
          <div class="stat-value" :style="{color: btResult.summary.nd.avg_high>=0 ? 'var(--up)' : 'var(--down)'}">{{ fmtPct(btResult.summary.nd.avg_high) }}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">平均卖「次日收盘」</div>
          <div class="stat-value" :style="{color: btResult.summary.nd.avg_close>=0 ? 'var(--up)' : 'var(--down)'}">{{ fmtPct(btResult.summary.nd.avg_close) }}</div>
        </div>
      </template>
    </div>

    <div v-if="btResult && btResult.timeline.length" style="margin-bottom:14px">
      <div ref="btChartEl" style="width:100%;height:260px"></div>
    </div>

    <el-table v-if="btRows.length" :data="btRows" size="small" max-height="400">
      <el-table-column prop="trade_date" label="入选日期" width="100" />
      <el-table-column prop="rank" label="排名" width="60" align="center" />
      <el-table-column label="名称" min-width="130">
        <template #default="{ row }">{{ row.name }}<span style="color:var(--muted);font-size:12px"> {{ row.ts_code }}</span></template>
      </el-table-column>
      <el-table-column label="得分" width="70" align="right">
        <template #default="{ row }"><b>{{ row.score }}</b></template>
      </el-table-column>
      <el-table-column label="建议" width="100">
        <template #default="{ row }"><el-tag :type="adviceType(row.score)" size="small" effect="plain">{{ scoreAdvice(row.score) }}</el-tag></template>
      </el-table-column>
      <el-table-column label="N天收益" width="100" align="right">
        <template #default="{ row }"><b :style="{color: row.ret>=0 ? 'var(--up)' : 'var(--down)'}">{{ fmtPct(row.ret) }}</b></template>
      </el-table-column>
      <el-table-column label="次日开盘" width="90" align="right">
        <template #default="{ row }"><span :style="{color: row.open_ret!=null && row.open_ret>=0 ? 'var(--up)' : 'var(--down)'}">{{ row.open_ret!=null ? fmtPct(row.open_ret) : '—' }}</span></template>
      </el-table-column>
      <el-table-column label="次日最高" width="90" align="right">
        <template #default="{ row }"><span :style="{color: row.high_ret!=null && row.high_ret>=0 ? 'var(--up)' : 'var(--down)'}">{{ row.high_ret!=null ? fmtPct(row.high_ret) : '—' }}</span></template>
      </el-table-column>
      <el-table-column label="次日收盘" width="90" align="right">
        <template #default="{ row }"><span :style="{color: row.close_ret!=null && row.close_ret>=0 ? 'var(--up)' : 'var(--down)'}">{{ row.close_ret!=null ? fmtPct(row.close_ret) : '—' }}</span></template>
      </el-table-column>
    </el-table>
    <div v-else-if="btResult" style="color:var(--muted);font-size:13px;padding:8px 0">
      暂无完整回测数据 —— 该模式还没有走满 N 个交易日的记录（标准15:00 / 短线14:25 会自动积累）。
    </div>
  </el-dialog>

  <el-dialog v-model="settingsVisible" title="设置" width="640px">
    <el-form label-width="140px" label-position="left">
      <el-divider content-position="left">大模型（LLM 报告生成）</el-divider>
      <el-form-item label="API 地址"><el-input v-model="cfgForm.llm.base_url" placeholder="https://api.deepseek.com/v1" /></el-form-item>
      <el-form-item label="API Key"><el-input v-model="cfgForm.llm.api_key" type="password" show-password placeholder="留空则使用模板报告" /></el-form-item>
      <el-form-item label="模型名称"><el-input v-model="cfgForm.llm.model" placeholder="deepseek-chat" /></el-form-item>
      <el-form-item label="报告数量 Top N"><el-input-number v-model="cfgForm.llm.top_n_reports" :min="1" :max="50" /></el-form-item>
      <el-divider content-position="left">Tushare 数据通道</el-divider>
      <el-form-item label="PCD API Key"><el-input v-model="cfgForm.tushare.pcd_api_key" /></el-form-item>
      <el-form-item label="RDS API Key"><el-input v-model="cfgForm.tushare.rds_api_key" /></el-form-item>
      <el-divider content-position="left">📮 邮件推送（14:25 短线榜单）</el-divider>
      <el-form-item label="发件邮箱"><el-input v-model="cfgForm.mail.sender" placeholder="如 123456@qq.com" /></el-form-item>
      <el-form-item label="SMTP 授权码"><el-input v-model="cfgForm.mail.auth_code" type="password" show-password placeholder="QQ邮箱→设置→账户→开启SMTP服务生成授权码" /></el-form-item>
      <el-form-item label="收件邮箱"><el-input v-model="cfgForm.mail.recipient" placeholder="接收榜单的邮箱（可=发件邮箱）" /></el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="settingsVisible=false">取消</el-button>
      <el-button type="primary" @click="saveSettings">保存</el-button>
    </template>
  </el-dialog>
</div>
</script>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/element-plus.full.min.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script>
const { ref, computed, onMounted, onBeforeUnmount, nextTick, watch, createApp } = Vue
const ElMessage = ElementPlus.ElMessage
const ElMessageBox = ElementPlus.ElMessageBox

const DIM_ORDER = ['value','quality','growth','trend','momentum','capital','chip','safety','macro']
const DIM_NAME = { value:'价值估值', quality:'资产质量', growth:'盈利成长', trend:'趋势技术面', momentum:'量价动能', capital:'主力资金流', chip:'筹码与情绪', safety:'安全边际', macro:'景气与宏观' }

const api = {
  async req(path, opts={}) {
    const r = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts })
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText)
    return r.json()
  },
  config: () => api.req('/api/config'),
  saveConfig: (b) => api.req('/api/config', { method:'PUT', body:JSON.stringify(b) }),
  startScan: (mode) => api.req('/api/scan', { method:'POST', body:JSON.stringify({mode: mode || 'normal'}) }),
  scanProgress: () => api.req('/api/scan/progress'),
  scanResult: (id) => api.req('/api/scan/' + id),
  latestScan: () => api.req('/api/scan/latest'),
  marketOverview: () => api.req('/api/market/overview'),
  stockDetail: (code, runId) => api.req('/api/stocks/' + code + '/detail?run_id=' + (runId||'')),
  history: () => api.req('/api/history'),
  compare: (a,b) => api.req('/api/history/compare?a='+a+'&b='+b),
  deleteRun: (id) => api.req('/api/history/'+id, { method:'DELETE' }),
  backtestRecords: () => api.req('/api/backtest/records'),
  backtest: (n, mode) => api.req('/api/backtest?n='+n+'&mode='+(mode||'normal')),
  pushSchedule: () => api.req('/api/push/schedule', { method:'POST' }),
  pushCancel: () => api.req('/api/push/cancel', { method:'POST' }),
  pushPreview: () => api.req('/api/push/preview', { method:'POST' }),
  pushStatus: () => api.req('/api/push/status')
}

const app = createApp({
  template: '#app-tpl',
  setup() {
    const indices = ref({})
    const top20 = ref([])
    const summary = ref({})
    const latestRun = ref(null)
    const scanning = ref(false)
    const scanMsg = ref('')
    const progressPct = ref(0)
    const detailVisible = ref(false)
    const detail = ref(null)
    const detailTitle = ref('')
    const tab = ref('kline')
    const report = ref('')
    const klineEl = ref(null)
    const radarEl = ref(null)
    const factorRows = ref([])
    const historyVisible = ref(false)
    const settingsVisible = ref(false)
    const runs = ref([])
    const cmpA = ref(null)
    const cmpB = ref(null)
    const compareRows = ref([])
    const backtestVisible = ref(false)
    const btN = ref(5)
    const btMode = ref('normal')
    const btLoading = ref(false)
    const btResult = ref(null)
    const btChartEl = ref(null)
    const shortMode = ref(localStorage.getItem('xuanfp_mode') === 'short')
    const pushScheduled = ref(false)
    const pushPreviewing = ref(false)
    const cfgForm = ref({ llm:{base_url:'',api_key:'',model:'',top_n_reports:10}, tushare:{pcd_api_key:'',rds_api_key:''}, mail:{smtp_host:'',smtp_port:465,sender:'',auth_code:'',recipient:''} })

    let pollTimer = null
    let pushTimer = null
    let klineChart = null
    let radarChart = null
    let btChart = null

    const fmtPct = (v) => (v==null ? '—' : (v>0?'+':'') + Number(v).toFixed(2) + '%')
    const scoreColor = (s) => s>85 ? '#f59e0b' : s>70 ? '#3b82f6' : s>60 ? '#10b981' : '#6b7280'
    const scoreAdvice = (s) => s>=85 ? '建议加仓' : s>=75 ? '建议买入' : s>=65 ? '建议持有' : s>=55 ? '建议观望' : '建议回避'
    const adviceType = (s) => s>=85 ? 'success' : s>=75 ? 'success' : s>=65 ? 'primary' : s>=55 ? 'warning' : 'danger'
    const runLabel = (r) => {
      const t = r.created_at ? new Date(r.created_at*1000) : new Date()
      const p = (n) => String(n).padStart(2,'0')
      const dt = p(t.getMonth()+1) + '-' + p(t.getDate()) + ' ' + p(t.getHours()) + ':' + p(t.getMinutes())
      const modeTag = r.mode === 'short' ? '⚡短线' : '📊综合'
      return '#' + (r.seq ?? r.id) + ' ' + dt + ' ' + modeTag + '（池 ' + (r.passed_size ?? '-') + '）'
    }
    const stopTarget = (row, kind) => {
      const p = row.price, a = row.atr_pct
      if (p == null || a == null) return '—'
      const v = kind === 'target' ? p*(1+1.5*a/100) : p*(1-a/100)
      return v.toFixed(2)
    }

    function renderMd(text) {
      if (!text) return ''
      let h = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      h = h.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>')
      h = h.replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>')
      h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      h = h.replace(/^[-*] (.*)$/gm,'<p>• $1</p>')
      h = h.replace(/\n/g,'<br/>').replace(/<br\/><br\/>/g,'</p><p>')
      return '<p>'+h+'</p>'
    }

    async function loadOverview() {
      try { const d = await api.marketOverview(); indices.value = d.indices || {} } catch(e){}
    }
    async function loadLatest() {
      try {
        const d = await api.latestScan()
        if (d.run) { latestRun.value = d.run; summary.value = d.run.summary || {}; top20.value = (d.run.top20 || []).map((r,i)=>({...r,rank:i+1})) }
      } catch(e){}
    }
    async function startScan() {
      if (scanning.value) return
      try {
        await api.startScan(shortMode.value ? 'short' : 'normal')
        scanning.value = true; scanMsg.value = (shortMode.value ? '⚡短线' : '综合') + '模式扫描启动中…'; progressPct.value = 0
        pollTimer = setInterval(pollProgress, 1500)
      } catch(e) { ElMessage.error('启动扫描失败: ' + e.message) }
    }
    async function pollProgress() {
      try {
        const p = await api.scanProgress()
        scanMsg.value = p.message || p.phase
        if (p.total > 0) progressPct.value = Math.round(p.done/p.total*100)
        if (p.phase === 'done' && !p.running) { clearInterval(pollTimer); scanning.value=false; progressPct.value=100; ElMessage.success('扫描完成！'); await loadLatest(); await loadHistory() }
        else if (p.phase === 'failed' && !p.running) { clearInterval(pollTimer); scanning.value=false; ElMessage.error(p.message || '扫描失败') }
      } catch(e){}
    }

    async function openDetail(row) {
      detailVisible.value = true
      detailTitle.value = row.name + '（' + row.ts_code + '）'
      detail.value = row; tab.value = 'kline'; report.value = ''; factorRows.value = []
      try {
        const d = await api.stockDetail(row.ts_code, latestRun.value?.id)
        detail.value = d.stock; report.value = d.report
        factorRows.value = buildFactorRows(d.stock)
        await nextTick()
        renderKline(d.kline)
        if (tab.value === 'radar') renderRadar(d.stock)
      } catch(e) { ElMessage.warning('详情加载失败: ' + e.message) }
    }
    function buildFactorRows(stock) {
      const rows = []
      const dims = stock.dimensions || {}
      for (const dim of DIM_ORDER) {
        const d = dims[dim]
        rows.push({ name:'【'+DIM_NAME[dim]+'】'+(d?.score!=null ? d.score+' 分' : '缺失(降权)'), score:null, note:'可得 '+(d?.available)+'/'+(d?.total)+' 因子', _dim:true })
        const fs = stock.factors || {}
        for (const k of Object.keys(fs)) if (fs[k].dim === dim) rows.push({ name:fs[k].name, score:fs[k].score, note:fs[k].note, _dim:false })
      }
      return rows
    }
    function renderKline(bars) {
      if (!klineEl.value || !bars || !bars.length) return
      if (!klineChart) klineChart = echarts.init(klineEl.value)
      const closes = bars.map(b=>b.close)
      const ma = (n) => closes.map((_,i)=> i<n-1 ? null : closes.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n)
      klineChart.setOption({
        backgroundColor:'transparent', tooltip:{trigger:'axis'},
        grid:{left:50,right:20,top:20,bottom:30},
        xAxis:{type:'category',data:bars.map(b=>b.date),axisLine:{lineStyle:{color:'#30363d'}},axisLabel:{color:'#8b949e'}},
        yAxis:{scale:true,axisLabel:{color:'#8b949e'},splitLine:{lineStyle:{color:'#21262d'}}},
        dataZoom:[{type:'inside',start:60,end:100}],
        series:[
          {name:'K线',type:'candlestick',data:bars.map(b=>[b.open,b.close,b.low,b.high]),itemStyle:{color:'#f5222d',color0:'#52c41a',borderColor:'#f5222d',borderColor0:'#52c41a'}},
          {name:'MA5',type:'line',data:ma(5),smooth:true,showSymbol:false,lineStyle:{width:1,color:'#f59e0b'}},
          {name:'MA10',type:'line',data:ma(10),smooth:true,showSymbol:false,lineStyle:{width:1,color:'#3b82f6'}},
          {name:'MA20',type:'line',data:ma(20),smooth:true,showSymbol:false,lineStyle:{width:1,color:'#a78bfa'}},
          {name:'MA60',type:'line',data:ma(60),smooth:true,showSymbol:false,lineStyle:{width:1,color:'#10b981'}}
        ]
      })
      klineChart.resize()
    }
    function renderRadar(stock) {
      if (!radarEl.value || !stock) return
      if (!radarChart) radarChart = echarts.init(radarEl.value)
      const dims = stock.dimensions || {}
      radarChart.setOption({
        backgroundColor: 'transparent',
        tooltip: { formatter: (p) => p.value ? `${p.name}：${Math.round(p.value)} 分` : '' },
        radar: {
          indicator: DIM_ORDER.map(d => ({ name: DIM_NAME[d], max: 100 })),
          radius: '78%', center: ['50%', '52%'], splitNumber: 5,
          axisName: { color: '#c9d1d9', fontSize: 12 },
          axisLine: { lineStyle: { color: '#30363d' } },
          splitLine: { lineStyle: { color: '#30363d' } },
          splitArea: { areaStyle: { color: ['#161b22', '#1c2128'] } }
        },
        series: [{
          type: 'radar', symbol: 'circle', symbolSize: 6,
          data: [{
            value: DIM_ORDER.map(d => dims[d]?.score ?? 0),
            name: stock.name || stock.ts_code,
            areaStyle: { color: 'rgba(59,130,246,.3)' },
            lineStyle: { color: '#3b82f6', width: 2 },
            itemStyle: { color: '#60a5fa' }
          }]
        }]
      })
      // 容器可能刚由隐藏转为显示（尺寸刚从 0 恢复），下一帧再自适应
      requestAnimationFrame(() => { if (radarChart) radarChart.resize() })
    }

    async function loadHistory() {
      try {
        const d = await api.history()
        // 按时间从早到晚排序，显示序号按位置连续分配（内部 id 不变）
        const arr = (d.runs || []).slice().sort((a,b) => (a.created_at||0) - (b.created_at||0))
        runs.value = arr.map((r,i) => ({...r, seq: i+1}))
      } catch(e){}
    }
    async function openHistory() {
      historyVisible.value = true
      await loadHistory()
    }
    async function deleteRun(runId) {
      try {
        await ElMessageBox.confirm('确定删除这次扫描记录吗？删除后不可恢复（含该次的股票得分与 AI 报告）。', '删除确认', { confirmButtonText:'删除', cancelButtonText:'取消', type:'warning' })
        await api.deleteRun(runId)
        ElMessage.success('已删除')
        // 删除后剩余记录保持时间顺序并重新分配连续序号
        runs.value = runs.value.filter(r => r.id !== runId).map((r,i) => ({...r, seq: i+1}))
        await loadLatest()
      } catch(e) { if (e !== 'cancel' && e !== 'close') ElMessage.error('删除失败: ' + e.message) }
    }
    async function doCompare() {
      try {
        const d = await api.compare(cmpA.value, cmpB.value)
        compareRows.value = [...(d.up||[]), ...(d.down||[])].map(r=>({...r, change: r.diff>=0?'上升':'下降'}))
      } catch(e) { ElMessage.error('对比失败: ' + e.message) }
    }
    async function openBacktest() {
      backtestVisible.value = true
    }
    async function runBacktest() {
      btLoading.value = true
      try {
        const d = await api.backtest(btN.value, btMode.value)
        btResult.value = d
        await nextTick()
        renderBtChart()
      } catch(e) { ElMessage.error('回测失败: ' + e.message) }
      finally { btLoading.value = false }
    }
    // 回测表：把批次拍平成「一行一只股票」，各字段横排严格对齐
    const btRows = computed(() => {
      const rows = []
      for (const b of btResult.value?.batches || []) {
        for (const s of b.records) rows.push({ ...s, trade_date: b.trade_date })
      }
      return rows
    })
    function renderBtChart() {
      const tl = btResult.value?.timeline || []
      if (!btChartEl.value || !tl.length) return
      if (!btChart) btChart = echarts.init(btChartEl.value)
      const up = '#f5222d', down = '#52c41a'
      btChart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger:'axis', formatter: (p) => { const x = p[0]; return x.axisValue + '：' + (x.data>=0?'+':'') + x.data + '%' } },
        grid: { left:60, right:24, top:24, bottom:34 },
        xAxis: { type:'category', data: tl.map(t=>t.date), axisLine:{lineStyle:{color:'#30363d'}}, axisLabel:{color:'#8b949e'} },
        yAxis: { type:'value', axisLabel:{color:'#8b949e', formatter:'{value}%'}, splitLine:{lineStyle:{color:'#21262d'}} },
        series: [{
          name:'每批平均收益', type:'line', data: tl.map(t=>t.avg_ret), smooth:true, symbol:'circle', symbolSize:7,
          lineStyle:{color:'#3b82f6',width:2}, itemStyle:{ color:(p)=> p.value>=0 ? up : down },
          markLine: { silent:true, symbol:'none', data:[{yAxis:0}], lineStyle:{color:'#8b949e',type:'dashed'} }
        }]
      })
      btChart.resize()
    }
    async function loadSettings() {
      try {
        const d = await api.config()
        cfgForm.value = { llm:d.llm, tushare:d.tushare, mail:{ smtp_host:d.mail?.smtp_host || 'smtp.qq.com', smtp_port:d.mail?.smtp_port || 465, sender:d.mail?.sender || '', auth_code:d.mail?.auth_code || '', recipient:d.mail?.recipient || '' } }
      } catch(e){}
    }
    async function saveSettings() {
      try {
        await api.saveConfig({ llm:cfgForm.value.llm, tushare:cfgForm.value.tushare, mail:cfgForm.value.mail })
        ElMessage.success('设置已保存'); settingsVisible.value=false
      } catch(e) { ElMessage.error('保存失败: ' + e.message) }
    }
    async function schedulePush() {
      if (pushScheduled.value) {
        try {
          await api.pushCancel()
          pushScheduled.value = false
          ElMessage.success('已取消明日推送')
        } catch(e) { ElMessage.error('取消失败: ' + e.message) }
        return
      }
      try {
        const d = await api.pushSchedule()
        pushScheduled.value = true
        ElMessage.success('已安排 ' + d.target_date + ' ' + d.target_time + ' 自动推送（⚡短线模式）')
      } catch(e) { ElMessage.error('安排失败: ' + e.message) }
    }
    async function previewPush() {
      try {
        const d = await api.pushPreview()
        if (!d.ok) { ElMessage.error(d.error || '预演启动失败'); return }
        pushPreviewing.value = true
        ElMessage.info('预演已启动：正在短线扫描并发邮件，约需 1~2 分钟')
        if (pushTimer) clearInterval(pushTimer)
        pushTimer = setInterval(checkPushStatus, 15000)
      } catch(e) { ElMessage.error('预演失败: ' + e.message) }
    }
    async function checkPushStatus() {
      try {
        const d = await api.pushStatus()
        pushScheduled.value = d.scheduled
        pushPreviewing.value = !!d.preview_running
        if (!d.preview_running && d.last_preview) {
          if (pushTimer) { clearInterval(pushTimer); pushTimer = null }
          if (d.last_preview.ok) ElMessage.success('预演完成，邮件已发送，请查收！')
          else ElMessage.error('预演失败: ' + (d.last_preview.error || '未知错误'))
        }
      } catch(e){}
    }
    async function loadPushStatus() {
      try {
        const d = await api.pushStatus()
        pushScheduled.value = d.scheduled
        pushPreviewing.value = !!d.preview_running
      } catch(e){}
    }

    // 切换标签页时，等容器有真实尺寸后再绘制/自适应（解决雷达图缩在角落的问题）
    watch(tab, (v) => {
      nextTick(() => {
        if (v === 'kline' && klineChart) klineChart.resize()
        else if (v === 'radar') renderRadar(detail.value)
      })
    })
    // 短线模式开关记忆
    watch(shortMode, (v) => { try { localStorage.setItem('xuanfp_mode', v ? 'short' : 'normal') } catch(e){} })

    onMounted(() => {
      loadOverview(); loadLatest(); loadSettings(); loadHistory(); loadPushStatus(); setInterval(loadOverview, 15000)
      // 容器尺寸变化（抽屉/窗口缩放）时自适应
      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(() => {
          if (klineChart) klineChart.resize()
          if (radarChart) radarChart.resize()
          if (btChart) btChart.resize()
        })
        if (klineEl.value) ro.observe(klineEl.value)
        if (radarEl.value) ro.observe(radarEl.value)
        if (btChartEl.value) ro.observe(btChartEl.value)
      }
    })
    onBeforeUnmount(() => {
      if (pollTimer) clearInterval(pollTimer)
      if (pushTimer) clearInterval(pushTimer)
      if (klineChart) klineChart.dispose()
      if (radarChart) radarChart.dispose()
      if (btChart) btChart.dispose()
    })

    return { indices, top20, summary, latestRun, scanning, scanMsg, progressPct,
      detailVisible, detail, detailTitle, tab, report, klineEl, radarEl, factorRows,
      historyVisible, settingsVisible, runs, cmpA, cmpB, compareRows, cfgForm,
      backtestVisible, btN, btMode, btLoading, btResult, btChartEl, btRows,
      shortMode, pushScheduled, pushPreviewing,
      fmtPct, scoreColor, scoreAdvice, adviceType, runLabel, stopTarget, renderMd, startScan, openDetail, doCompare, deleteRun, openHistory, openBacktest, runBacktest, schedulePush, previewPush, saveSettings }
  }
})
app.use(ElementPlus)
app.mount('#app')
</script>
</body>
</html>
